# Development database only. The application itself is not containerised - it runs from the
# IDE or via ./mvnw spring-boot:run and connects to this on localhost.
#
#   docker compose up -d db
#
# No "version:" key: it has been obsolete since Compose v2 and current versions warn about it.

services:
  db:
    image: postgres:16-alpine
    container_name: recipe-api-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recipes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recipes}
      POSTGRES_DB: ${POSTGRES_DB:-recipes}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume, so the data survives "docker compose down" and container recreation.
      - recipe-db-data:/var/lib/postgresql/data
    healthcheck:
      # Postgres briefly accepts connections during init before it is actually ready, so
      # "container started" is not the same as "database usable". pg_isready is the real check.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recipes} -d ${POSTGRES_DB:-recipes}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  recipe-db-data:
