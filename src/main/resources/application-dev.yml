# Activate with: --spring.profiles.active=dev  (or SPRING_PROFILES_ACTIVE=dev)
#
# Everything here is diagnostics. Nothing in this profile changes application behaviour, so a
# bug seen with the profile on is a real bug.

spring:
  jpa:
    properties:
      hibernate:
        format_sql: true
        # Prints a summary after every session: statements prepared, collections fetched, time
        # spent. Reading SQL logs tells you what ran; this tells you how MANY times, which is the
        # only way to see an N+1 for what it is rather than as "a lot of similar-looking queries".
        generate_statistics: true

# Diagnostics again: /actuator/health lists every contributing component, so "is it the database?"
# is answerable from the endpoint rather than from the logs. Off in the default profile, where the
# same detail is reconnaissance.
management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.stat: DEBUG
