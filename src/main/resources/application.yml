spring:
  application:
    name: recipe-api

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:recipes}
    username: ${POSTGRES_USER:recipes}
    password: ${POSTGRES_PASSWORD:recipes}

  jpa:
    hibernate:
      # validate, never update or create-drop. Flyway owns the schema; Hibernate's job is to
      # complain loudly when the mapping and the migrations have drifted apart.
      ddl-auto: validate
    # Off deliberately. Spring Boot defaults this to true and warns about it at startup: it
    # holds the persistence context open for the whole HTTP request, so a lazy association
    # touched during JSON serialisation quietly issues a query instead of failing. That hides
    # exactly the N+1 problems Phase 13 exists to find.
    open-in-view: false

  data:
    web:
      pageable:
        default-page-size: 20
        # Hard ceiling. Without it, size=100000 is a one-request denial of service:
        # the query returns and the whole result set is mapped into memory before
        # anything is written out. Spring clamps larger values to this rather than
        # rejecting them.
        max-page-size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration

# Health only. Actuator ships a lot of endpoints - env, beans, mappings, configprops - and every
# one of them describes the inside of this application to anyone who asks. Boot's default HTTP
# exposure is already just health; it is written out because it is a decision rather than an
# accident, and because the obvious way to "fix" a missing endpoint later is to set include: "*".
#
# The database is what makes this endpoint worth calling: spring-boot-starter-data-jpa contributes
# a DataSourceHealthIndicator, so an application that is running but cannot reach Postgres reports
# DOWN instead of a 200 that means nothing. That is the difference between a liveness check and a
# readiness one.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # The aggregate status, and nothing else. The per-component detail names the database
      # product and its validation query, which is free reconnaissance for anyone who can reach
      # the port. The dev profile turns it on, because reading it is the point there.
      show-details: never

# The spec is generated from the controllers and the records, so it cannot drift from the code.
# Both paths are springdoc's defaults; they are written out because they are public URLs this
# project's README points at, and a default that moves in a future version would move them.
#
# Nothing here reaches the network: springdoc-openapi-starter-webmvc-ui bundles the
# org.webjars:swagger-ui assets, so the page and every script it loads come out of the jar.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Alphabetical rather than declaration order, so the page reads the same after any
    # rearranging of the controllers.
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
